baseURL: "https://dipankarsrirag.github.io/"
title: Dipankar Srirag
theme: dipankar

enableInlineShortcodes: true
enableRobotsTXT: true
# Show papers dated by an upcoming conference (e.g. EMNLP, INLG).
buildFuture: true

outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, llms]
  section: [HTML]
pagination:
  pagerSize: 20

disableKinds: [taxonomy, term]

menu:
  main:
    # params.icon: a name from themes/dipankar/layouts/partials/nav-icon.html
    # params.iconOnly: show just the icon (the name is still read out by screen readers)
    - name: me
      url: /
      weight: 1
      params: { icon: hand }
    - name: research
      url: /publications/
      weight: 2
    - name: teaching
      url: /courses/
      weight: 3
    - name: resume
      url: /cv.pdf
      weight: 4
    - name: journal
      url: /journal/
      weight: 5
      params: { icon: notebook-pen, iconOnly: true }
    - name: photography
      url: /photography/
      weight: 6
      params: { icon: images, iconOnly: true }

params:
  description: "Ph.D. candidate at UNSW Sydney working on NLP for linguistically diverse nurse-patient communication and clinical decision support in the emergency department, with a background in dialect robustness."
  author: Dipankar Srirag
  authorNative: "దిపాంకర్ శ్రీరాగ్"
  authorNativeLang: te
  role: "Ph.D. Candidate"
  affiliation: "UNSW Sydney"
  photo: "profile.jpg"
  # Used for search engines and AI assistants (meta keywords, JSON-LD knowsAbout).
  knowsAbout:
    - Natural Language Processing
    - Clinical NLP
    - Emergency Department Triage
    - Large Language Models
    - Nurse-Patient Communication
    - Clinical Decision Support
    - Dialect Robustness
    - Varieties of English
    - Speech and Dialogue Systems
  socialIcons:
    - name: Email
      url: mailto:d.srirag@unsw.edu.au
    - name: Scholar
      url: https://scholar.google.com/citations?user=8dUrhxwAAAAJ
    - name: GitHub
      url: https://github.com/dipankarsrirag
    - name: Twitter
      url: https://x.com/dipankarsrirag
    - name: Bluesky
      url: https://bsky.app/profile/dipankarsrirag.bsky.social

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true   # lets you write {.class} under a paragraph or table
    extensions:
      passthrough:    # math: $inline$ or \( \), and $$display$$ or \[ \]
        enable: true
        delimiters:
          inline: [["\\(", "\\)"], ["$", "$"]]
          block: [["\\[", "\\]"], ["$$", "$$"]]
  highlight:
    guessSyntax: true
    style: github
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2
